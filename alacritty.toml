# alacritty.toml
# By OldJobobo (https://github.com/OldJobobo)
#

[window]
opacity = 0.888

[colors]
transparent_background_colors = true

[colors.primary]
background = "#eee1c3"
foreground = "#190403"

[colors.normal]
black   = "#eee1c3"
red     = "#6b2e06"
green   = "#465900"
yellow  = "#61620d"
blue    = "#004584"
magenta = "#6d2e52"
cyan    = "#00656a"
white   = "#190403"

[colors.bright]
black   = "#b59b72"
red     = "#944e1e"
green   = "#657e00"
yellow  = "#838707"
blue    = "#2865b6"
magenta = "#964b79"
cyan    = "#2b8a90"
white   = "#391d19"

[colors.cursor]
text   = "#eee1c3"
cursor = "#190403"

