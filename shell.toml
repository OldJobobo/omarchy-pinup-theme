# Omarchy shell theme tokens for the Pinup theme. These values are read from
# ~/.config/omarchy/current/theme/shell.toml by omarchy-shell.

[bar]
background       = "#eee1c3"
background-alpha = 0.85
text             = "#190403"
active           = "#6b2e06"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "rgba(004584ee) rgba(2865b6f2) rgba(6d2e52d6) 38deg"
active-border-foreground = "rgb(004584) rgb(2865b6) 38deg"

[controls]
normal-color        = "#190403"
normal-fill-alpha   = 0.04
normal-border-width = 1
normal-border-alpha = 0.28

hover-cursor-color        = "#004584"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#2865b6"
focus-fill-alpha   = 0.12
focus-border-width = 1
focus-border-alpha = 0.75

selected-color        = "#004584"
selected-fill-alpha   = 0.18
selected-border-width = 1
selected-border-alpha = 0.65

pressed-color        = "#6d2e52"
pressed-fill-alpha   = 0.22
selection-color      = "#004584"
selection-fill-alpha = 0.35

[spacing]
scale = 1.05
scale-with-font = true
control-gap = 8
control-padding-x = 11
control-padding-y = 6
input-padding-y = 7
control-height = 29
popup-row-height = 30
row-gap = 8
row-padding-x = 12
label-gap = 4
panel-gap = 15
panel-padding = 19
popup-padding = 15
dropdown-width = 250
searchable-dropdown-width = 270
number-field-width = 124
searchable-popup-min-height = 230

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
title = 14
heading = 16
display = 24
display-large = 28
icon-small = 11
icon = 14
icon-large = 18

[popups]
background       = "#eee1c3"
background-alpha = 0.98
text             = "#190403"
border           = "#b59b72"
border-alpha     = 1.0

[tooltip]
background       = "#eee1c3"
background-alpha = 0.97
text             = "#190403"
border           = "#004584"
border-alpha     = 0.9

[notifications]
background       = "#eee1c3"
background-alpha = 0.98
text             = "#190403"
border           = "#6d2e52"
border-alpha     = 1.0
countdown        = "#004584"

[launcher]
background                = "#eee1c3"
background-alpha          = 0.94
text                      = "#190403"
border                    = "#b59b72"
border-alpha              = 1.0
scrim                     = "#190403"
scrim-alpha               = 0.22
selected-background       = "#004584"
selected-background-alpha = 0.16
selected-text             = "#004584"
selected-border           = "#2865b6"
selected-border-alpha     = 0.65

[menu]
background                = "#eee1c3"
background-alpha          = 0.98
text                      = "#190403"
border                    = "#b59b72"
border-alpha              = 1.0
scrim                     = "#190403"
scrim-alpha               = 0.20
selected-background       = "#004584"
selected-background-alpha = 0.16
selected-text             = "#004584"
selected-border           = "#2865b6"
selected-border-alpha     = 0.65

[polkit]
background       = "#eee1c3"
background-alpha = 0.98
text             = "#190403"
text-error       = "#6b2e06"
border           = "#004584"
border-error     = "#6b2e06"
border-alpha     = 1.0
scrim            = "#190403"
scrim-alpha      = 0.24
accent           = "#004584"

[lock]
background       = "#eee1c3"
background-alpha = 0.84
text             = "#190403"
text-error       = "#6b2e06"
border           = "#b59b72"
border-active    = "#004584"
border-error     = "#6b2e06"
border-alpha     = 1.0
selection        = "#004584"
selection-alpha  = 0.42

[image-picker]
scrim                   = "#190403"
scrim-alpha             = 0.34
text                    = "#eee1c3"
selected-border         = "#004584"
selected-border-alpha   = 1.0
unselected-border       = "#eee1c3"
unselected-border-alpha = 0.36

