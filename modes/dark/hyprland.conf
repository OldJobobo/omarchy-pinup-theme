# This file is not a full Hyprland configuration.
# It is intended to be included by older Omarchy/Hyprland theme loaders.
# Keep it in sync with hyprland.lua where possible.

$activeBorderColor = rgba(5f8fd8ee) rgba(8cb2eef2) rgba(b86591d6) 38deg
$inactiveBorderColor = rgba(6f4d3ca8)
$groupInactiveBorderColor = rgba(6f4d3c82)
$activeGroupbarColor = rgba(190403ec) rgba(8cb2ee40) 38deg
$inactiveGroupbarColor = rgba(190403b8)
$lockedActiveGroupbarColor = rgba(b8659145)
$lockedInactiveGroupbarColor = rgba(6f4d3c55)
$groupbarTextColor = rgb(f1dfbe)
$groupbarTextColorInactive = rgba(f1dfbeaa)
$activeShadowColor = rgba(0000005a)
$inactiveShadowColor = rgba(00000034)

general {
    gaps_in = 8
    gaps_out = 18
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $groupInactiveBorderColor

    groupbar {
        enabled = true
        blur = true
        gradients = true
        stacked = false
        height = 25
        gaps_in = 5
        gaps_out = 0
        indicator_height = 2
        indicator_gap = 4
        font_family = monospace
        font_size = 12
        font_weight_active = bold
        font_weight_inactive = normal
        text_color = $groupbarTextColor
        text_color_inactive = $groupbarTextColorInactive
        col.active = $activeGroupbarColor
        col.inactive = $inactiveGroupbarColor
        col.locked_active = $lockedActiveGroupbarColor
        col.locked_inactive = $lockedInactiveGroupbarColor
        gradient_rounding = 10
        gradient_rounding_power = 2
    }
}

decoration {
    rounding = 12
    rounding_power = 2
    active_opacity = 0.999
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.045
    dim_special = 0.10

    blur {
        enabled = true
        size = 5
        passes = 3
        special = true
        popups = true
        input_methods = true
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.04
        contrast = 0.92
        brightness = 1.08
        vibrancy = 0.08
        vibrancy_darkness = 0.16
        popups_ignorealpha = 0.55
        input_methods_ignorealpha = 0.55
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        offset = 2 3
        color = $activeShadowColor
        color_inactive = $inactiveShadowColor
    }
}

animations {
    enabled = true

    bezier = pinupSnap, 0.18, 0.92, 0.22, 1.0
    bezier = pinupFloat, 0.24, 0.82, 0.20, 1.0
    bezier = pinupFade, 0.38, 0.0, 0.14, 1.0
    bezier = pinupSlide, 0.20, 0.96, 0.30, 1.0

    animation = global, 1, 8, pinupSnap
    animation = windows, 1, 5, pinupFloat
    animation = windowsIn, 1, 5, pinupSnap, popin 12%
    animation = windowsOut, 1, 4, pinupFade, popin 82%
    animation = windowsMove, 1, 5, pinupFloat
    animation = border, 1, 6, pinupFade
    animation = borderangle, 1, 12, linear, once
    animation = fade, 1, 4, pinupFade
    animation = fadeIn, 1, 4, pinupFade
    animation = fadeOut, 1, 3, pinupFade
    animation = layers, 1, 5, pinupSlide, slidefade
    animation = layersIn, 1, 5, pinupSnap, slidefade
    animation = layersOut, 1, 4, pinupFade, fade
    animation = workspaces, 1, 4, pinupSlide, slidefade
    animation = specialWorkspace, 1, 4, pinupSlide, slidevert
}

