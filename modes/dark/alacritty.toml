# alacritty.toml
# By OldJobobo (https://github.com/OldJobobo)
#

[window]
opacity = 0.888

[colors]
transparent_background_colors = true

[colors.primary]
background = "#190403"
foreground = "#f1dfbe"

[colors.normal]
black   = "#190403"
red     = "#b45a24"
green   = "#8da33c"
yellow  = "#c5a64f"
blue    = "#5f8fd8"
magenta = "#b86591"
cyan    = "#3fa0a6"
white   = "#f1dfbe"

[colors.bright]
black   = "#6f4d3c"
red     = "#d0793d"
green   = "#a9bf5a"
yellow  = "#d9bd67"
blue    = "#8cb2ee"
magenta = "#d587ae"
cyan    = "#68bdc2"
white   = "#fff1d2"

[colors.cursor]
text   = "#190403"
cursor = "#f1dfbe"

